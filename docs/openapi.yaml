openapi: 3.0.3
info:
  title: TaskFlow API
  description: Scalable REST API with JWT Authentication and Role-Based Access Control
  version: 1.0.0
  contact:
    name: TaskFlow Team

servers:
  - url: http://localhost:4000/api/v1
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code:    { type: string }
            message: { type: string }

    User:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        email:      { type: string, format: email }
        role:       { type: string, enum: [user, admin] }
        createdAt:  { type: string, format: date-time }

    Task:
      type: object
      properties:
        id:          { type: string, format: uuid }
        userId:      { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        status:      { type: string, enum: [todo, in_progress, done] }
        priority:    { type: string, enum: [low, medium, high] }
        dueDate:     { type: string, format: date-time, nullable: true }
        createdAt:   { type: string, format: date-time }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:     { type: string, example: Ada Lovelace }
                email:    { type: string, example: ada@example.com }
                password: { type: string, example: "Str0ng!Pass" }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/User' }
        '409':
          description: Email already exists

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:  { type: string }
                  refreshToken: { type: string }
                  expiresIn:    { type: number, example: 900 }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke refresh token
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Logged out }

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:    { $ref: '#/components/schemas/User' }

  /users:
    get:
      tags: [Users]
      summary: List all users (admin only)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: role
          schema: { type: string, enum: [user, admin] }
      responses:
        '200': { description: List of users }
        '403': { description: Forbidden }

  /tasks:
    get:
      tags: [Tasks]
      summary: Get my tasks with filtering and pagination
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [todo, in_progress, done] }
        - in: query
          name: priority
          schema: { type: string, enum: [low, medium, high] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: sort
          schema: { type: string, enum: [createdAt, dueDate, priority] }
      responses:
        '200':
          description: Paginated task list
    post:
      tags: [Tasks]
      summary: Create a new task
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:       { type: string }
                description: { type: string }
                status:      { type: string, enum: [todo, in_progress, done] }
                priority:    { type: string, enum: [low, medium, high] }
                dueDate:     { type: string, format: date-time }
      responses:
        '201': { description: Task created }

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Task found }
        '403': { description: Access denied }
        '404': { description: Not found }
    patch:
      tags: [Tasks]
      summary: Update task (partial)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string }
                description: { type: string }
                status:      { type: string, enum: [todo, in_progress, done] }
                priority:    { type: string, enum: [low, medium, high] }
      responses:
        '200': { description: Task updated }
    delete:
      tags: [Tasks]
      summary: Delete task
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Task deleted }

  /tasks/all:
    get:
      tags: [Tasks]
      summary: Get ALL tasks across all users (admin only)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: All tasks with user info }
        '403': { description: Forbidden }
